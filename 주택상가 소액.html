    .cards{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
    .card{border:1px solid #e2e8f0;border-radius:22px;padding:20px;background:#fff}
    .card.house{background:linear-gradient(180deg,#eff6ff,#fff)}
    .card.store{background:linear-gradient(180deg,#fff7ed,#fff)}
    .card h3{margin:0 0 12px;font-size:22px}
    .metric-grid{display:grid;gap:12px}
    .metric{border:1px solid #e2e8f0;border-radius:18px;padding:14px;background:rgba(255,255,255,.85)}
    .metric .k{color:#64748b;font-size:13px;margin-bottom:6px}
    .metric .v{font-size:28px;font-weight:800;letter-spacing:-.03em}
    .meta{display:grid;gap:10px;margin-top:18px}
    .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px dashed #e2e8f0}
    .row:last-child{border-bottom:none}
    .row .k{color:#64748b} .row .v{text-align:right;font-weight:700}
    .section-title{margin:14px 0 8px;font-size:18px;font-weight:800}
    .table-wrap{border:1px solid #e2e8f0;border-radius:14px;overflow:auto;background:#fff}
    .table-wrap.house-table thead th{background:#dbeafe;color:#1e3a8a}
    .table-wrap.store-table thead th{background:#fef3c7;color:#92400e}
    .table-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    @media (max-width:1000px){.table-grid{grid-template-columns:1fr}}

    table{width:100%;border-collapse:collapse;font-size:12px; line-height:1.2}
    th,td{padding:7px 6px;border-bottom:1px solid #e2e8f0;text-align:left;vertical-align:middle;white-space:nowrap}
    th{background:#f8fafc;font-size:13px;color:#475569;position:sticky;top:0}

    .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    .btn.secondary{background:#e2e8f0;color:#0f172a;box-shadow:none}
    .error-box{border:1px solid #fecaca;background:#fef2f2;color:#b91c1c;border-radius:16px;padding:16px;margin-top:12px}
    @media (max-width:1000px){.form-grid{grid-template-columns:1fr 1fr} .cards{grid-template-columns:1fr} .summary-grid{grid-template-columns:1fr 1fr}}

  <script>
    const HOUSING_CSV_URL = "https://raw.githubusercontent.com/CH-partners/housing-db/main/housing_rules_vba.csv";
    const COMMERCIAL_CSV_URL = "https://raw.githubusercontent.com/CH-partners/housing-db/main/commercial_rules_vba.csv";

    let HOUSING_DATA = [];
    let COMMERCIAL_DATA = [];

    function stripBom(value) {
      return String(value ?? "").replace(/^\uFEFF/, "").trim();
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];

        if (ch === '"') {
          if (inQuotes && next === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (ch === ',' && !inQuotes) {
          row.push(cell);
          cell = "";
        } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
          if (ch === '\r' && next === '\n') i++;
          row.push(cell);
          if (row.some(v => String(v).trim() !== "")) rows.push(row);
          row = [];
          cell = "";
        } else {
          cell += ch;
        }
      }

      row.push(cell);
      if (row.some(v => String(v).trim() !== "")) rows.push(row);
      if (rows.length === 0) return [];

      const headers = rows[0].map(stripBom);
      return rows.slice(1).map(values => {
        const obj = {};
        headers.forEach((header, index) => {
          obj[header] = stripBom(values[index]);
        });
        return obj;
      });
    }

    function pick(row, keys, fallback = "") {
      for (const key of keys) {
        if (row[key] !== undefined && String(row[key]).trim() !== "") return String(row[key]).trim();
      }
      return fallback;
    }

    function toNumberValue(value) {
      const n = Number(String(value ?? "").replace(/[^0-9.-]/g, ""));
      return Number.isFinite(n) ? n : 0;
    }

    function normalizeRuleRow(row, type) {
      const common = {
        metro: pick(row, ["metro", "시도", "광역시도", "특별시광역시도"]),
        city_gu: pick(row, ["city_gu", "city", "시군구", "구", "군구"], "전체"),
        dong: pick(row, ["dong", "dong_ri_eup_myeon", "동", "읍면동", "리"], "전체"),
        start_date: pick(row, ["start_date", "base_date", "start", "시작일", "적용시작일", "기준일"]),
        end_date: pick(row, ["end_date", "end", "종료일", "적용종료일"], type === "commercial" ? "9999-12-31" : "2026-12-31")
      };

      if (type === "housing") {
        return {
          ...common,
          limit_deposit: toNumberValue(pick(row, ["limit_deposit", "보증금", "소액보증금", "주택용보증금"])),
          small_amount: toNumberValue(pick(row, ["small_amount", "최우선변제액", "주택용최우선변제액"]))
        };
      }

      return {
        ...common,
        year: toNumberValue(pick(row, ["year", "년도", "연도"])),
        priority_protected: toNumberValue(pick(row, ["priority_protected", "선순위보호보증금", "상가선순위보호보증금"])),
        converted_deposit: toNumberValue(pick(row, ["converted_deposit", "환산보증금", "상가후순위환산보증금"])),
        top_priority_amount: toNumberValue(pick(row, ["top_priority_amount", "최우선변제액", "상가최우선변제액"]))
      };
    }

    async function loadCsvData(url, type) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`${url} 로딩 실패: ${response.status}`);
      const text = await response.text();
      return parseCsv(text)
        .map(row => normalizeRuleRow(row, type))
        .filter(row => row.metro && row.start_date && row.end_date);
    }

    const modal = document.getElementById("resultModal");
    const modalContent = document.getElementById("modalContent");
    const metroSelect = document.getElementById("metroSelect");
    const citySelect = document.getElementById("citySelect");
    const dongSelect = document.getElementById("dongSelect");
    
    const settingDate = document.getElementById("settingDate");
    
    function formatDateValue(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, "0");
      const d = String(dateObj.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }
    
    function normalizeDateInput(raw) {
      if (!raw) return "";
    
      let v = String(raw).trim();
      v = v.replace(/\./g, "-").replace(/\//g, "-").replace(/\s+/g, "");
    
      if (/^\d{8}$/.test(v)) {
        return `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
      }
    
      if (/^\d{7}$/.test(v)) {
        return `${v.slice(0,4)}-0${v.slice(4,5)}-${v.slice(5,7)}`;
      }
    
      const m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
      if (m) {
        const yyyy = m[1];
        const mm = String(Number(m[2])).padStart(2, "0");
        const dd = String(Number(m[3])).padStart(2, "0");
        return `${yyyy}-${mm}-${dd}`;
      }
    
      return v;
    }
    
    function isValidDateString(dateStr) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return false;
      const d = new Date(dateStr + "T00:00:00");
      return !Number.isNaN(d.getTime()) && formatDateValue(d) === dateStr;
    }
    
    function syncDateInputs(dateStr) {
      settingDate.value = dateStr;
    }
    
    function normalizeMainDateInput() {
      const normalized = normalizeDateInput(settingDate.value);
      if (isValidDateString(normalized)) {
        syncDateInputs(normalized);
        return normalized;
      }
      return "";
    }
    
    function openModal(html){ modalContent.innerHTML = html; modal.classList.add("open"); }
    function closeModal(){ modal.classList.remove("open"); }
    document.getElementById("closeModal").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });

    function formatMoney(num){ return new Intl.NumberFormat("ko-KR").format(num) + "원"; }
    function toDate(s){ return new Date(s + "T00:00:00"); }
    function unique(arr){ return [...new Set(arr)]; }
    function allRows(){ return [...HOUSING_DATA, ...COMMERCIAL_DATA]; }

    function populateMetro() {
      const metros = unique(allRows().map(r => r.metro)).sort((a,b) => a.localeCompare(b,'ko'));
      metroSelect.innerHTML = metros.map(v => `<option value="${v}">${v}</option>`).join("");
      populateCity();
    }
    function populateCity() {
      const metro = metroSelect.value;
      const cities = unique(allRows().filter(r => r.metro === metro).map(r => r.city_gu || "전체"))
        .sort((a,b) => (a === "전체" ? -1 : b === "전체" ? 1 : a.localeCompare(b,'ko')));
      citySelect.innerHTML = cities.map(v => `<option value="${v}">${v}</option>`).join("");
      populateDong();
    }
    function populateDong() {
      const metro = metroSelect.value;
      const city = citySelect.value;
      const dongs = unique(allRows().filter(r => r.metro === metro && (r.city_gu || "전체") === city).map(r => r.dong || "전체"))
        .sort((a,b) => (a === "전체" ? -1 : b === "전체" ? 1 : a.localeCompare(b,'ko')));
      dongSelect.innerHTML = dongs.map(v => `<option value="${v}">${v}</option>`).join("");
    }

    function scoreRegion(row, metro, city, dong) {
      if (row.metro === metro && row.city_gu === city && row.dong === dong) return 4;
      if (row.metro === metro && row.city_gu === city && row.dong === "전체") return 3;
      if (row.metro === metro && row.city_gu === "전체") return 2;
      return 0;
    }

    function findCurrentHousing(metro, city, dong, settingDate) {
      return HOUSING_DATA
        .map(r => ({...r, score: scoreRegion(r, metro, city, dong)}))
        .filter(r => r.score > 0)
        .filter(r => toDate(r.start_date) <= settingDate && settingDate <= toDate(r.end_date))
        .sort((a,b) => (b.score - a.score) || (toDate(b.start_date) - toDate(a.start_date)))[0] || null;
    }

    function scoreCommercialRegion(row, metro, city, dong) {
      if (row.metro === metro && row.city_gu === city && row.dong === dong) return 4;
      if (row.metro === metro && row.city_gu === city && row.dong === "전체") return 3;
      if (row.metro === metro && row.city_gu === "전체") return 2;
      if (row.metro === metro) return 1;
      return 0;
    }

    function addDays(dateStr, days) {
      const d = toDate(dateStr);
      d.setDate(d.getDate() + days);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function normalizeCommercialHistoryRows(rows) {
      const bestByStart = new Map();

      rows.forEach(r => {
        const key = r.start_date;
        if (!bestByStart.has(key)) {
          bestByStart.set(key, {...r});
          return;
        }
        const prev = bestByStart.get(key);
        if ((r.score || 0) > (prev.score || 0)) {
          bestByStart.set(key, {...r});
        }
      });

      const normalized = [...bestByStart.values()]
        .sort((a, b) => toDate(a.start_date) - toDate(b.start_date))
        .map(r => ({...r}));

      for (let i = 0; i < normalized.length; i++) {
        const next = normalized[i + 1];
        if (next) {
          normalized[i].end_date = addDays(next.start_date, -1);
        } else if (toDate(normalized[i].start_date) > toDate(normalized[i].end_date)) {
          normalized[i].end_date = "9999-12-31";
        }
      }

      return normalized.filter(r => toDate(r.start_date) <= toDate(r.end_date));
    }

    function findCurrentCommercial(metro, city, dong, settingDate) {
      return getCommercialHistory(metro, city, dong)
        .filter(r => toDate(r.start_date) <= settingDate && settingDate <= toDate(r.end_date))[0] || null;
    }

    function getHousingHistory(metro, city, dong) {
      const rows = HOUSING_DATA
        .map(r => ({...r, score: scoreRegion(r, metro, city, dong)}))
        .filter(r => r.score > 0)
        .sort((a,b) => toDate(a.start_date) - toDate(b.start_date));

      const bestByPeriod = new Map();
      rows.forEach(r => {
        const key = r.start_date + "|" + r.end_date;
        if(!bestByPeriod.has(key) || bestByPeriod.get(key).score < r.score) bestByPeriod.set(key, r);
      });
      return [...bestByPeriod.values()].sort((a,b) => toDate(a.start_date) - toDate(b.start_date));
    }

    function getCommercialHistory(metro, city, dong) {
      const rows = COMMERCIAL_DATA
        .map(r => ({...r, score: scoreCommercialRegion(r, metro, city, dong)}))
        .filter(r => r.score > 0)
        .sort((a,b) => toDate(a.start_date) - toDate(b.start_date));

      return normalizeCommercialHistoryRows(rows);
    }

    function buildHousingCard(row, settingDateStr) {
      if(!row) return `<div class="card house"><h3>주택</h3><div class="error-box">${settingDateStr} 기준으로 적용되는 주택 데이터가 없습니다.</div></div>`;
      return `
        <div class="card house">
          <h3>주택 현재 적용값</h3>
          <div class="metric-grid">
            <div class="metric"><div class="k">주택 소액보증금</div><div class="v">${formatMoney(row.limit_deposit)}</div></div>
            <div class="metric"><div class="k">주택 최우선변제액</div><div class="v">${formatMoney(row.small_amount)}</div></div>
          </div>
          <div class="meta">
            <div class="row"><div class="k">근저당권 설정일</div><div class="v">${settingDateStr}</div></div>
            <div class="row"><div class="k">적용 지역</div><div class="v">${row.metro} ${row.city_gu} ${row.dong}</div></div>
            <div class="row"><div class="k">적용 기간</div><div class="v">${row.start_date} ~ ${row.end_date}</div></div>
          </div>
        </div>`;
    }

    function buildCommercialCard(row, settingDateStr) {
      if(!row) return `<div class="card store"><h3>상가</h3><div class="error-box">${settingDateStr} 기준으로 적용되는 상가 데이터가 없습니다.</div></div>`;
      return `
        <div class="card store">
          <h3>상가 현재 적용값</h3>
          <div class="metric-grid">
            <div class="metric"><div class="k">상가 선순위 보호 보증금</div><div class="v">${formatMoney(row.priority_protected)}</div></div>
            <div class="metric"><div class="k">상가 후순위 환산보증금</div><div class="v">${formatMoney(row.converted_deposit)}</div></div>
            
            <div class="metric"><div class="k">상가 최우선변제액</div><div class="v">${formatMoney(row.top_priority_amount)}</div></div>
          </div>
          <div class="meta">
            <div class="row"><div class="k">근저당권 설정일</div><div class="v">${settingDateStr}</div></div>
            <div class="row"><div class="k">적용 지역</div><div class="v">${row.metro} ${row.city_gu} ${row.dong}</div></div>
            <div class="row"><div class="k">적용 기간</div><div class="v">${row.start_date} ~ ${row.end_date}</div></div>
          </div>
        </div>`;
    }

    function buildHousingTable(rows) {
      return `
        <div class="table-wrap house-table">
          <table>
            <thead><tr><th colspan="2">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;근저당권설정일</th><th>주택용 보증금</th><th>주택용 최우선변제액</th></tr></thead>
            <tbody>
              ${rows.map(r => `<tr><td>${r.start_date}</td><td>${r.end_date}</td><td>${formatMoney(r.limit_deposit)}</td><td>${formatMoney(r.small_amount)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    function buildCommercialTable(rows) {
      return `
        <div class="table-wrap store-table">
          <table>
            <thead><tr><th colspan="2">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;근저당권설정일</th><th>상가 선순위 보호 보증금</th><th>상가 후순위 환산보증금</th><th>상가 최우선변제액</th></tr></thead>
            <tbody>
              ${rows.map(r => `<tr><td>${r.start_date}</td><td>${r.end_date}</td><td style="padding-left:40px;">${formatMoney(r.priority_protected)}</td><td style="padding-left:40px;">${formatMoney(r.converted_deposit)}</td><td style="padding-left:40px;">${formatMoney(r.top_priority_amount)}</td></tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }

    function renderResult(dateOverride) {
      const metro = metroSelect.value;
      const city = citySelect.value;
      const dong = dongSelect.value;
    
      const settingDateStr = dateOverride || normalizeMainDateInput();
    
      if (!settingDateStr || !isValidDateString(settingDateStr)) {
        openModal(`
          <div class="modal-head">
            <div class="eyebrow" style="background:#fef2f2;color:#b91c1c;">오류</div>
            <h2>조회에 실패했습니다</h2>
            <div class="error-box">최초 설정일 입력칸에 날짜를 입력하세요. 형식은 YYYY-MM-DD 입니다.</div>
          </div>
        `);
        return;
      }
    
      syncDateInputs(settingDateStr);
    
      const settingDate = toDate(settingDateStr);
      const currentHousing = findCurrentHousing(metro, city, dong, settingDate);
      const currentCommercial = findCurrentCommercial(metro, city, dong, settingDate);
      const housingHistory = getHousingHistory(metro, city, dong);
      const commercialHistory = getCommercialHistory(metro, city, dong);
    
      openModal(`
        <div class="modal-head">
          <div class="eyebrow">조회 완료</div>
          <h2>소액보증금 조회 결과</h2>
          <div class="sub">${metro} · ${city} · ${dong} · 설정일 ${settingDateStr}</div>
        </div>
    
        <div class="summary">
          <div class="summary-grid">
            <div class="mini"><span class="k">특별시 / 광역시 / 도</span><div class="v">${metro}</div></div>
            <div class="mini"><span class="k">시 / 군 / 구</span><div class="v">${city}</div></div>
            <div class="mini"><span class="k">동 / 리 / 읍 / 면</span><div class="v">${dong}</div></div>
            <div class="mini">
                <span class="k">근저당권 설정일</span>
                <input
                  class="input"
                  id="modalSettingDate"
                  type="text"
                  value="${settingDateStr}"
                  placeholder="YYYY-MM-DD"
                  style="height:44px;font-size:15px;"
                />
                <button
                  class="btn"
                  type="button"
                  id="modalRequeryBtn"
                  style="margin-top:8px;height:44px;font-size:14px;padding:0 14px;"
                >
                  다시 조회
                </button>
              </div>
          </div>
        </div>
    
        <div class="cards">
          ${buildHousingCard(currentHousing, settingDateStr)}
          ${buildCommercialCard(currentCommercial, settingDateStr)}
        </div>
    
        <div class="table-grid">
          <div>
            <div class="section-title">주택용 소액 금액표</div>
            ${buildHousingTable(housingHistory)}
          </div>
          <div>
            <div class="section-title">상가용 소액 금액표</div>
            ${buildCommercialTable(commercialHistory)}
          </div>
        </div>
    
        <div class="foot">
          주택 표는 선택 주소와 관련된 전체 기간을, 주택 표와 상가 표 모두 선택한 지역과 가장 관련 있는 행만 기간별로 1건씩 표시합니다.
        </div>
    
        <div class="actions">
          <button class="btn secondary" onclick="document.getElementById('resultModal').classList.remove('open');">닫기</button>
        </div>
      `);
      const modalSettingDate = document.getElementById("modalSettingDate");
      const modalRequeryBtn = document.getElementById("modalRequeryBtn");
      
      if (modalSettingDate && modalRequeryBtn) {
        modalSettingDate.addEventListener("blur", () => {
          const normalized = normalizeDateInput(modalSettingDate.value);
          if (isValidDateString(normalized)) {
            modalSettingDate.value = normalized;
          }
        });
      
        modalSettingDate.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            modalRequeryBtn.click();
          }
        });
      
        modalRequeryBtn.addEventListener("click", () => {
          const normalized = normalizeDateInput(modalSettingDate.value);
      
          if (!isValidDateString(normalized)) {
            alert("날짜 형식은 YYYY-MM-DD 입니다.");
            return;
          }
      
          syncDateInputs(normalized);
          renderResult(normalized);
        });
      }
    }    

    metroSelect.addEventListener("change", populateCity);
    citySelect.addEventListener("change", populateDong);
        
    document.getElementById("searchBtn").addEventListener("click", () => {
      const normalized = normalizeMainDateInput();
      if (!normalized) {
        openModal(`
          <div class="modal-head">
            <div class="eyebrow" style="background:#fef2f2;color:#b91c1c;">오류</div>
            <h2>조회에 실패했습니다</h2>
            <div class="error-box">최초 설정일 입력칸에 날짜를 입력하세요. 형식은 YYYY-MM-DD 입니다.</div>
          </div>
        `);
        return;
      }
      renderResult();
    });
    
    async function initApp() {
      const loadStatus = document.getElementById("loadStatus");
      const searchBtn = document.getElementById("searchBtn");
      searchBtn.disabled = true;
      searchBtn.textContent = "대기";

      try {
        const [housingRows, commercialRows] = await Promise.all([
          loadCsvData(HOUSING_CSV_URL, "housing"),
          loadCsvData(COMMERCIAL_CSV_URL, "commercial")
        ]);

        HOUSING_DATA = housingRows;
        COMMERCIAL_DATA = commercialRows;

        populateMetro();
        syncDateInputs("2023-02-21");

        searchBtn.disabled = false;
        searchBtn.textContent = "조회";
        if (loadStatus) {
          loadStatus.textContent = `데이터 로딩 완료 · 주택 ${HOUSING_DATA.length.toLocaleString("ko-KR")}건 · 상가 ${COMMERCIAL_DATA.length.toLocaleString("ko-KR")}건`;
        }
      } catch (error) {
        console.error(error);
        searchBtn.textContent = "오류";
        if (loadStatus) {
          loadStatus.style.color = "#fecaca";
          loadStatus.textContent = "GitHub CSV 데이터를 불러오지 못했습니다. 인터넷 연결 또는 CSV 주소를 확인하세요.";
        }
        openModal(`
          <div class="modal-head">
            <div class="eyebrow" style="background:#fef2f2;color:#b91c1c;">오류</div>
            <h2>데이터 로딩에 실패했습니다</h2>
            <div class="error-box">GitHub CSV 파일을 불러오지 못했습니다.<br>${String(error.message || error)}</div>
          </div>
        `);
      }
    }

    initApp();
  </script>
</body>
</html>
