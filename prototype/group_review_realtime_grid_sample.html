<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그룹리뷰 공동편집 그리드 샘플</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Noto Sans KR,Arial,sans-serif;background:#eef1f5;color:#111827}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{background:#17202c;color:white;padding:20px 14px}.brand{padding:4px 8px 20px;border-bottom:1px solid #ffffff20;margin-bottom:18px}.brand b{font-family:Georgia,serif;font-size:20px}.brand small{display:block;margin-top:5px;letter-spacing:1.5px;opacity:.7}.nav{padding:11px 10px;border-radius:8px;background:#ffffff16;margin-top:6px}
main{min-width:0}.top{height:62px;background:white;border-bottom:1px solid #d9dee7;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.top h1{font-size:18px;margin:0}.badge{border:1px solid #d9dee7;border-radius:999px;padding:6px 10px;font-size:12px}.online{color:#059669}
.content{padding:18px 20px}.rowtop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}.rowtop select{padding:8px 10px;border:1px solid #d9dee7;border-radius:8px;background:white;min-width:250px}.presence{font-size:12px;color:#6b7280}
.tabs{display:flex;gap:6px;overflow:auto;background:white;border:1px solid #d9dee7;border-bottom:0;padding:9px 9px 0;border-radius:10px 10px 0 0}.tab{border:1px solid transparent;border-bottom:0;background:#f3f4f6;padding:8px 12px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap}.tab.active{background:white;border-color:#d9dee7;font-weight:700;position:relative;top:1px}
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:white;border:1px solid #d9dee7;padding:9px}.toolbar button,.toolbar select{height:34px;border:1px solid #d9dee7;background:white;border-radius:6px;padding:0 10px;cursor:pointer}.toolbar .bold{font-weight:800}.toolbar .strike{text-decoration:line-through}.color{height:34px;border:1px solid #d9dee7;border-radius:6px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px}.color input{width:28px;height:24px;border:0;padding:0}.spacer{flex:1}.state{font-size:12px;color:#6b7280}
.grid{overflow:auto;background:white;border:1px solid #d9dee7;border-top:0;min-height:430px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:1120px;table-layout:fixed}th,td{border-right:1px solid #d9dee7;border-bottom:1px solid #d9dee7}th{position:sticky;top:0;background:#f7f8fa;z-index:3;padding:10px 8px;font-size:12px}td{padding:0;vertical-align:top;position:relative}.no{width:48px;text-align:center;background:#fafafa;color:#6b7280;font-size:12px;vertical-align:middle}.cell{min-height:38px;padding:8px;outline:none;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.cell.center{text-align:center}.cell:focus,.cell.selected{box-shadow:inset 0 0 0 2px #2563eb}.cell.locked{box-shadow:inset 0 0 0 2px #f59e0b;background:#fffbeb!important;cursor:not-allowed}.lock{position:absolute;right:4px;top:-18px;background:#f59e0b;color:white;font-size:10px;padding:2px 5px;border-radius:4px 4px 0 0;z-index:5}.del{width:100%;height:38px;border:0;background:transparent;color:#9ca3af;font-size:18px;cursor:pointer}.del:hover{background:#fef2f2;color:#dc2626}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:white;border:1px solid #d9dee7;border-top:0;border-radius:0 0 10px 10px;padding:10px}.btn{border:1px solid #d9dee7;background:white;border-radius:7px;padding:8px 12px;cursor:pointer}.finish{background:#059669;color:white;border-color:#059669}.hint{font-size:12px;color:#6b7280}.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:10px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.18s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{display:none}.content{padding:12px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><b>법무법인 淸賢</b><small>CH PARTNERS</small></div>
  <div class="nav">그룹리뷰</div><div class="nav">프로젝트</div><div class="nav">분배표</div><div class="nav">일정</div>
</aside>
<main>
  <header class="top"><h1>그룹리뷰 · 실시간 공동편집 샘플</h1><div><span class="badge online">● 실시간 연결</span> <span class="badge">관리자</span></div></header>
  <section class="content">
    <div class="rowtop">
      <div><strong>프로젝트&nbsp;</strong><select><option>그룹리뷰 샘플 A</option><option>그룹리뷰 샘플 B</option></select></div>
      <div class="presence">● 관리자　● 작업자1　● 작업자2　· 3명 접속 중</div>
    </div>
    <div id="tabs" class="tabs"></div>
    <div class="toolbar">
      <select id="size"><option value="12">12px</option><option value="13" selected>13px</option><option value="15">15px</option><option value="18">18px</option><option value="22">22px</option></select>
      <button id="bold" class="bold" type="button">B</button>
      <button id="strike" class="strike" type="button">S</button>
      <label class="color">셀 색 <input id="bg" type="color" value="#fff3b0"></label>
      <button id="clear" type="button">서식 지우기</button>
      <span class="spacer"></span><span id="status" class="state">셀을 선택하세요.</span>
    </div>
    <div class="grid">
      <table>
        <thead><tr>
          <th style="width:48px">#</th><th style="width:78px">Collateral#</th><th style="width:58px">Sheet</th><th style="width:66px">Field No.</th><th style="width:410px">변경전</th><th style="width:410px">변경후</th><th style="width:60px">삭제</th>
        </tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>
    <div class="bottom">
      <div><button id="add" class="btn" type="button">+ 행 추가</button></div>
      <div><span class="hint">HTML 샘플 · 실제 DB 저장 없음&nbsp;&nbsp;</span><button id="finish" class="btn finish" type="button">입력 완료</button></div>
    </div>
  </section>
</main>
</div>
<div id="toast" class="toast"></div>
<script>
(()=>{
const members=["작업자1","작업자2","작업자3","작업자4","작업자5","작업자6"];
const seed=[
{collateral:"C-001",sheet:"등기부",field:"12",before:"근저당권 설정",after:"말소 예정",style:{}},
{collateral:"C-002",sheet:"임대차",field:"7",before:"보증금 50,000,000",after:"보증금 45,000,000",style:{}},
{collateral:"C-003",sheet:"현황",field:"3",before:"점유자 확인 필요",after:"현장조사 완료",style:{}},
{collateral:"",sheet:"",field:"",before:"",after:"",style:{}},
{collateral:"",sheet:"",field:"",before:"",after:"",style:{}}
];
const data={};members.forEach(m=>data[m]=JSON.parse(JSON.stringify(seed)));
let member=members[0], selected=null, lock={row:1,key:"after"};
const tabs=document.getElementById("tabs"), body=document.getElementById("body"), status=document.getElementById("status"), toast=document.getElementById("toast");
function msg(t){toast.textContent=t;toast.classList.add("show");clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove("show"),1600)}
function drawTabs(){tabs.innerHTML="";members.forEach(m=>{const b=document.createElement("button");b.className="tab"+(m===member?" active":"");b.textContent=m;b.type="button";b.onclick=()=>{member=m;selected=null;drawTabs();draw();status.textContent=m+" 시트"};tabs.appendChild(b)})}
function choose(el){document.querySelectorAll(".cell.selected").forEach(x=>x.classList.remove("selected"));el.classList.add("selected");selected={el,row:+el.dataset.row,key:el.dataset.key};status.textContent=member+" · "+(selected.row+1)+"행 · "+selected.key}
function makeCell(i,key,val){const td=document.createElement("td"),d=document.createElement("div");d.className="cell"+(["collateral","sheet","field"].includes(key)?" center":"");d.contentEditable="true";d.spellcheck=false;d.dataset.row=i;d.dataset.key=key;d.textContent=val||"";
const s=data[member][i].style?.[key]||{};if(s.size)d.style.fontSize=s.size+"px";if(s.bold)d.style.fontWeight="700";if(s.strike)d.style.textDecoration="line-through";if(s.bg)d.style.backgroundColor=s.bg;
if(lock&&lock.row===i&&lock.key===key){d.contentEditable="false";d.classList.add("locked");const l=document.createElement("span");l.className="lock";l.textContent="작업자2 편집 중";td.appendChild(l)}
d.onfocus=()=>choose(d);d.onclick=()=>choose(d);d.oninput=()=>{data[member][i][key]=d.innerText;status.textContent=member+" · 편집 중"};d.onblur=()=>status.textContent=member+" · 다른 사용자 화면에 즉시 반영됨";td.appendChild(d);return td}
function draw(){body.innerHTML="";data[member].forEach((r,i)=>{const tr=document.createElement("tr"),n=document.createElement("td");n.className="no";n.textContent=i+1;tr.appendChild(n);["collateral","sheet","field","before","after"].forEach(k=>tr.appendChild(makeCell(i,k,r[k])));const td=document.createElement("td"),b=document.createElement("button");b.className="del";b.type="button";b.textContent="×";b.onclick=()=>{data[member].splice(i,1);selected=null;draw();msg((i+1)+"행 삭제")};td.appendChild(b);tr.appendChild(td);body.appendChild(tr)})}
function have(){if(!selected||!selected.el.isConnected){msg("먼저 셀을 선택하세요.");return false}return true}
function fmt(){const r=data[member][selected.row];r.style||={};r.style[selected.key]||={};return r.style[selected.key]}
document.getElementById("size").onchange=e=>{if(!have())return;selected.el.style.fontSize=e.target.value+"px";fmt().size=+e.target.value};
document.getElementById("bold").onclick=()=>{if(!have())return;const s=fmt();s.bold=!s.bold;selected.el.style.fontWeight=s.bold?"700":"400"};
document.getElementById("strike").onclick=()=>{if(!have())return;const s=fmt();s.strike=!s.strike;selected.el.style.textDecoration=s.strike?"line-through":"none"};
document.getElementById("bg").oninput=e=>{if(!have())return;fmt().bg=e.target.value;selected.el.style.backgroundColor=e.target.value};
document.getElementById("clear").onclick=()=>{if(!have())return;data[member][selected.row].style[selected.key]={};selected.el.removeAttribute("style");msg("셀 서식 삭제")};
document.getElementById("add").onclick=()=>{data[member].push({collateral:"",sheet:"",field:"",before:"",after:"",style:{}});draw();msg("새 행 추가")};

document.getElementById("finish").onclick=()=>msg(member+" 시트 입력 완료 샘플");
drawTabs();draw();
})();
</script>
</body>
</html>
